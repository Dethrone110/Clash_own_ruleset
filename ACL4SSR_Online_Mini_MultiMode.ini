enable_rule_generator=true
overwrite_original_rules=true

[dns]
enable=true
listen=:53
enhanced-mode=fake-ip
fake-ip-range=198.18.0.1/16
default-nameserver=tls://223.5.5.5:853,tls://119.29.29.29:853,tls://1.1.1.1:853
nameserver=https://dns.alidns.com/dns-query,https://doh.pub/dns-query
fallback=https://1.1.1.1/dns-query,https://1.0.0.1/dns-query,https://dns.quad9.net/dns-query
fallback-filter:
  geoip=true
  geoip-code=CN
  ipcidr=0.0.0.0/32
proxy-server-nameserver=https://dns.alidns.com/dns-query,https://doh.pub/dns-query,https://1.1.1.1/dns-query
