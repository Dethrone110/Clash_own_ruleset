[custom]
; Legacy Subconverter template. New Stash/OpenClash workflows use the oldstore branch.
; Do not change keywords; rule order is priority from top to bottom.

; LAN and mobile push must bypass all account-sensitive routes.
ruleset=🎯 Direct,rules/ACL4SSR/Clash/LocalAreaNetwork.list
ruleset=🎯 Direct,https://raw.githubusercontent.com/Dethrone110/Clash_own_ruleset/optrule/mobile_push.list

; Mainland AI and mainland finance are explicit DIRECT exceptions.
ruleset=🎯 Direct,https://raw.githubusercontent.com/Dethrone110/Clash_own_ruleset/optrule/china_ai.list
ruleset=🎯 Direct,[]DOMAIN-SUFFIX,bankofchina.com
ruleset=🎯 Direct,[]DOMAIN-SUFFIX,unionpay.com

; International AI, Google, YouTube, TikTok, and US-sensitive accounts.
ruleset=🇺🇸 AI-US,https://raw.githubusercontent.com/Dethrone110/Clash_own_ruleset/optrule/ai.list
ruleset=🇺🇸 AI-US,https://raw.githubusercontent.com/Dethrone110/Clash_own_ruleset/optrule/us.list
ruleset=🇺🇸 AI-US,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=🇺🇸 AI-US,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list

; Account-bearing exchanges are country-sticky. Hong Kong finance is checked
; before the broad Web3 sources so an overlapping finance domain stays in HK.
ruleset=pipi-a,https://raw.githubusercontent.com/Dethrone110/Clash_own_ruleset/optrule/pipi_account.list
ruleset=ganggang,https://raw.githubusercontent.com/Dethrone110/Clash_own_ruleset/optrule/ganggang.list
ruleset=pipi-b,https://raw.githubusercontent.com/Dethrone110/Clash_own_ruleset/optrule/pipi.list
ruleset=pipi-b,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Crypto/Crypto.list
ruleset=pipi-b,https://raw.githubusercontent.com/szkane/ClashRuleSet/main/Clash/Web3.list
ruleset=pipi-b,[]SRC-IP-CIDR,192.168.6.218/32

; Lightweight blocking only.
ruleset=🛑 Block,rules/ACL4SSR/Clash/BanAD.list
ruleset=🛑 Block,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Hijacking.list
ruleset=🍃 Clean,rules/ACL4SSR/Clash/BanProgramAD.list

ruleset=✖️ X,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Twitter.list
ruleset=📢 Social,rules/ACL4SSR/Clash/Telegram.list
ruleset=📢 Social,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Discord.list
ruleset=📢 Social,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Reddit/Reddit.list
ruleset=📢 Social,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Slack/Slack.list
ruleset=📢 Social,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/WhatsApp.list
ruleset=📢 Social,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Signal/Signal.list
ruleset=📢 Social,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Instagram/Instagram.list
ruleset=📢 Social,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Facebook.list

ruleset=Ⓜ️ Microsoft,rules/ACL4SSR/Clash/Microsoft.list
ruleset=🍎 Apple,rules/ACL4SSR/Clash/Apple.list

ruleset=🚀 Proxy,rules/ACL4SSR/Clash/ProxyLite.list
ruleset=🔒 Direct-Extra,https://raw.githubusercontent.com/Dethrone110/Clash_own_ruleset/optrule/own_direct.list
ruleset=🎯 Direct,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=🎯 Direct,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleCN.list
ruleset=🎯 Direct,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 Direct,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 Direct,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list
ruleset=🎯 Direct,[]GEOSITE,CN
ruleset=🚀 Proxy,[]GEOSITE,geolocation-!cn
ruleset=🎯 Direct,[]GEOIP,CN,no-resolve
ruleset=🐟 Final,[]FINAL

; Region filters accept native names and names prefixed by a protocol tag.
; Extreme, Prestige, Ultimate, Max, Dynamic, IPv6, VLESS, and HY2 stay together.
custom_proxy_group=🌍 All Auto`url-test`(?i)^(\[[^]]+\]\s*)?(US|TW|JP|SG|HK|UK|DE|AU)(\s|$)`[]REJECT`https://www.gstatic.com/generate_204`600,,180
custom_proxy_group=🌐 All Nodes`select`(?i)^(\[[^]]+\]\s*)?(US|TW|JP|SG|HK|UK|DE|AU)(\s|$)`[]REJECT
custom_proxy_group=🇺🇸 US Auto`url-test`(?i)^(\[[^]]+\]\s*)?US(\s|$)`[]REJECT`https://www.gstatic.com/generate_204`600,,180
