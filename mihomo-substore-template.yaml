# Mihomo / Clash.Meta / Stash template for Sub-Store
# Sub-Store provides the proxies list; this file provides DNS, policy groups,
# rule-providers, and rule order converted from ACL4SSR_Online_Mini_MultiMode.ini.

mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - '*.push.apple.com'
    - '*.apple.com'

dns:
  enable: true
  listen: :53
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '*.home.arpa'
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - time-ios.apple.com
    - ntp.*.com
    - '*.xiaohongshu.com'
    - '*.xhscdn.com'
    - '*.xhslink.com'
    - mtalk.google.com
    - '*.mtalk.google.com'
    - '*.getui.com'
    - '*.igexin.com'
    - '*.igetui.com'
    - '*.jpush.cn'
    - '*.jpush.io'
    - '*.jiguang.cn'
    - '*.umeng.com'
    - '*.umengcloud.com'
    - '*.xmpush.xiaomi.com'
    - '*.mipush.xiaomi.com'
    - '*.hicloud.com'
    - '*.heytap.com'
    - '*.heytapmobi.com'
    - '*.allawnfs.com'
    - '*.allawno.com'
    - '*.allawntech.com'
    - '*.vivo.com'
    - '*.meizu.com'
  default-nameserver:
    - tls://223.5.5.5:853
    - tls://119.29.29.29:853
    - tls://1.1.1.1:853
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
    - https://dns.quad9.net/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 0.0.0.0/32
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://1.1.1.1/dns-query

proxy-groups:
  - name: 🚀 Proxy
    type: select
    proxies:
      - 🔥 Extreme Auto
      - 🇭🇰 HK Auto
      - 🇺🇸 US Auto
      - 🇯🇵 JPTW Auto
      - 🇸🇬 SG Auto
      - ♻️ Auto
      - DIRECT
    include-all: true

  - name: ♻️ Auto
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true

  - name: 🔥 Extreme Auto
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 800
    tolerance: 180
    include-all: true
    filter: '(?i)(Extreme|Prestige)'

  - name: 🔥 Extreme Nodes
    type: select
    include-all: true
    filter: '(?i)(Extreme|Prestige)'

  - name: 🇭🇰 HK Auto
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 120
    include-all: true
    filter: '(?i)HK'

  - name: 🇭🇰 HK Nodes
    type: select
    include-all: true
    filter: '(?i)HK'

  - name: 🇯🇵 JPTW Auto
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 700
    tolerance: 250
    include-all: true
    filter: '(?i)(JP|TW)'

  - name: 🇯🇵 JPTW Nodes
    type: select
    include-all: true
    filter: '(?i)(JP|TW)'

  - name: 🇹🇼 TW Nodes
    type: select
    include-all: true
    filter: '(?i)TW'

  - name: 🇸🇬 SG Auto
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 900
    tolerance: 250
    include-all: true
    filter: '(?i)SG'

  - name: 🇸🇬 SG Nodes
    type: select
    include-all: true
    filter: '(?i)SG'

  - name: 🇺🇸 US Auto
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 1200
    tolerance: 250
    include-all: true
    filter: '(?i)US'

  - name: 🇺🇸 US Nodes
    type: select
    include-all: true
    filter: '(?i)US'

  - name: 🇺🇸 AI-US
    type: select
    proxies:
      - 🇺🇸 US Auto
      - 🇺🇸 US Nodes

  - name: pipi
    type: select
    proxies:
      - 🇯🇵 JPTW Auto
      - 🇯🇵 JPTW Nodes
      - 🇹🇼 TW Nodes
      - 🇸🇬 SG Auto
      - 🇸🇬 SG Nodes
      - 🇭🇰 HK Auto
      - 🇭🇰 HK Nodes

  - name: ganggang
    type: select
    proxies:
      - 🇭🇰 HK Auto
      - 🇭🇰 HK Nodes

  - name: 🌍 Media
    type: select
    proxies:
      - 🔥 Extreme Auto
      - 🔥 Extreme Nodes
      - 🇺🇸 US Auto
      - 🇺🇸 US Nodes
      - 🇭🇰 HK Auto
      - 🇭🇰 HK Nodes
      - 🇯🇵 JPTW Auto
      - 🇯🇵 JPTW Nodes
      - 🇹🇼 TW Nodes
      - 🇸🇬 SG Auto
      - 🇸🇬 SG Nodes
      - ♻️ Auto
      - 🚀 Proxy
      - 🎯 Direct
    include-all: true

  - name: 📢 Social
    type: select
    proxies:
      - 🇭🇰 HK Auto
      - 🇭🇰 HK Nodes
      - 🇹🇼 TW Nodes
      - 🇸🇬 SG Auto
      - 🇸🇬 SG Nodes
      - 🇺🇸 US Auto
      - 🇺🇸 US Nodes
      - 🇯🇵 JPTW Auto
      - 🇯🇵 JPTW Nodes
      - 🔥 Extreme Auto
      - ♻️ Auto
      - 🚀 Proxy
      - 🎯 Direct
    include-all: true

  - name: ✖️ X
    type: select
    proxies:
      - 🇭🇰 HK Auto
      - 🇭🇰 HK Nodes
      - 🇹🇼 TW Nodes
      - 🇸🇬 SG Auto
      - 🇸🇬 SG Nodes
      - 🇺🇸 US Auto
      - 🇺🇸 US Nodes
      - 🇯🇵 JPTW Auto
      - 🇯🇵 JPTW Nodes
      - 🔥 Extreme Auto
      - ♻️ Auto
      - 🚀 Proxy
      - 🎯 Direct
    include-all: true

  - name: Ⓜ️ Microsoft
    type: select
    proxies:
      - 🔥 Extreme Auto
      - 🇺🇸 US Auto
      - 🇺🇸 US Nodes
      - 🇯🇵 JPTW Auto
      - 🇯🇵 JPTW Nodes
      - 🇹🇼 TW Nodes
      - 🇸🇬 SG Auto
      - 🇸🇬 SG Nodes
      - ♻️ Auto
      - 🎯 Direct
      - 🚀 Proxy
    include-all: true

  - name: 🍎 Apple
    type: select
    proxies:
      - 🔥 Extreme Auto
      - 🇺🇸 US Auto
      - 🇺🇸 US Nodes
      - 🇯🇵 JPTW Auto
      - 🇯🇵 JPTW Nodes
      - 🇹🇼 TW Nodes
      - 🇸🇬 SG Auto
      - 🇸🇬 SG Nodes
      - ♻️ Auto
      - 🚀 Proxy
      - 🎯 Direct
    include-all: true

  - name: 🎯 Direct
    type: select
    proxies:
      - DIRECT
      - 🚀 Proxy
      - ♻️ Auto

  - name: 🔒 Direct-Extra
    type: select
    proxies:
      - DIRECT

  - name: 🛑 Block
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🍃 Clean
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🐟 Final
    type: select
    proxies:
      - 🚀 Proxy
      - 🎯 Direct
      - ♻️ Auto
    include-all: true

