# Mihomo / Clash.Meta template for Sub-Store and OpenClash.
# Sub-Store injects the airport proxies. This file owns policy groups, DNS,
# rule-providers, and rule order. Stash uses stash-rules.stoverride instead.

mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: off

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - '*.push.apple.com'
    - '*.apple.com'

dns:
  enable: true
  listen: :53
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '*.home.arpa'
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - time-ios.apple.com
    - ntp.*.com
    - '*.xiaohongshu.com'
    - '*.xhscdn.com'
    - '*.xhslink.com'
    - mtalk.google.com
    - '*.mtalk.google.com'
    - '*.getui.com'
    - '*.igexin.com'
    - '*.igetui.com'
    - '*.jpush.cn'
    - '*.jpush.io'
    - '*.jiguang.cn'
    - '*.umeng.com'
    - '*.umengcloud.com'
    - '*.xmpush.xiaomi.com'
    - '*.mipush.xiaomi.com'
    - '*.hicloud.com'
    - '*.heytap.com'
    - '*.heytapmobi.com'
    - '*.allawnfs.com'
    - '*.allawno.com'
    - '*.allawntech.com'
    - '*.vivo.com'
    - '*.meizu.com'
  default-nameserver:
    - tls://223.5.5.5:853
    - tls://119.29.29.29:853
    - tls://1.1.1.1:853
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
    - https://dns.quad9.net/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 0.0.0.0/32
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://1.1.1.1/dns-query

